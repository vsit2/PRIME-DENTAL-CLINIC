<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0d9488" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Logo Mark: Modern Stylized Tooth with Smile Arc and Sparkle -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Tooth Background Badge -->
    <rect width="64" height="64" rx="16" fill="url(#primeGrad)" />
    
    <!-- Stylized Tooth Path -->
    <path d="M 32 17 C 24 17 20 21 20 28 C 20 36 24 43 27 50 C 28 52 30 52 31 49 C 32 46 32 41 32 41 C 32 41 32 46 33 49 C 34 52 36 52 37 50 C 40 43 44 36 44 28 C 44 21 40 17 32 17 Z" 
          fill="#ffffff" />
    
    <!-- Smile Arc Inside Tooth -->
    <path d="M 26 31 Q 32 37 38 31" 
          stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" fill="none" />
          
    <!-- Sparkle Star -->
    <path d="M 44 18 Q 44 23 49 23 Q 44 23 44 28 Q 44 23 39 23 Q 44 23 44 18 Z" 
          fill="url(#sparkleGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 20)">
    <!-- Brand Name -->
    <text x="0" y="24" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">PRIME <tspan fill="#0d9488">DENTAL</tspan></text>
    <!-- Tagline -->
    <text x="0" y="42" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="0.8">THE PRIME DESTINATION FOR SMILES</text>
  </g>
</svg>
